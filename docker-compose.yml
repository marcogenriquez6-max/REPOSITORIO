services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unior
      POSTGRES_PASSWORD: uniorpass
      POSTGRES_DB: unior_repo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unior"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://unior:uniorpass@db:5432/unior_repo
      JWT_SECRET: change-me-in-prod
      SEED_ADMIN_PASSWORD: ChangeMeAdminPass123!
      SEED_REVIEWER_PASSWORD: ChangeMeReviewerPass123!
      SEED_DEPOSITOR_PASSWORD: ChangeMeDepositorPass123!
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy && node dist/app.js"

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
