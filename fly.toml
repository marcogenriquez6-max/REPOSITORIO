app = 'repositorio-g-g5xq'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  API_PREFIX = '/api/v1'
  NODE_ENV = 'production'
  PORT = '4000'
  STORAGE_ROOT = '/app/storage'

[mounts]
  source = 'unior_storage'
  destination = '/app/storage'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 500

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/v1/health/ready'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
