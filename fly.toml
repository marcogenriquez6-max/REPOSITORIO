# fly.toml app configuration file generated for repositorio-g-g5xq on 2026-11-19T23:08:24Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'repositorio-g-g5xq'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  API_PREFIX = '/api/v1'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 500

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
