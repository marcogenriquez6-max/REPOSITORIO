app = "repositorio-g-g5xq-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_URL = "https://repositorio-g-g5xq.fly.dev/api/v1"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
